services:
  - type: web
    name: geospatial-measurement-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install pydantic-settings && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: "sqlite:///./geospatial.db"
